services:
  jackett:
    image: linuxserver/jackett:0.24.3042@sha256:4449c813592f6169dbb38bf0e966775e618905a267cd46538901060c6bb978d1
    container_name: jackett
    restart: unless-stopped
    ports:
      - 8031:9117
    volumes:
      - jackett_config:/config
    environment:
      - PUID=911
      - PGID=1000
      - TZ=Europe/Paris
      - JACKETT_KEY=${JACKETT_API_KEY:-}
    # links:
    #   - flaresolverr

  radarr:
    image: linuxserver/radarr:6.4.4@sha256:51a9ac2a9eb47afc833541e5fd6c11b86eb9f810694c22fa2429e3078e9194b2
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - radarr_config:/config
      - ./data:/data
    ports:
      - 8032:7878
    restart: unless-stopped
    links:
      - jackett
      - uploader

  sonarr:
    image: linuxserver/sonarr:4.0.20@sha256:673dc4609a5672bc8e46069c86ffcea283a86b48d34a6c93d8da8c24a1b87571
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - sonarr_config:/config
      - ./data:/data
    ports:
      - 8033:8989
    restart: unless-stopped
    links:
      - jackett
      - uploader

  # flaresolverr:
  #   image: flaresolverr/flaresolverr:v3.5.0
  #   container_name: flaresolverr
  #   environment:
  #     - LOG_LEVEL=${LOG_LEVEL:-info}
  #     - LOG_HTML=${LOG_HTML:-false}
  #     - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
  #     - TZ=Europe/London
  #   restart: unless-stopped

  uploader:
    container_name: torrent_uploader
    build: .
    command: npm run uploader
    environment:
      - ALLDEBRID_API_KEY=${ALLDEBRID_API_KEY}
    restart: unless-stopped
    volumes:
      - ./data:/data

  bootstrap:
    profiles:
      - bootstrap
    container_name: torrent_bootstrap
    build: .
    command: npm run bootstrap
    environment:
      - JACKETT_API_KEY=${JACKETT_API_KEY:-}
      - JACKETT_BASE_URL=http://jackett:9117
      - RADARR_BASE_URL=http://radarr:7878
      - RADARR_INDEXER_MIN_SEEDERS=${RADARR_INDEXER_MIN_SEEDERS:-5}
      - SONARR_BASE_URL=http://sonarr:8989
      - SONARR_INDEXER_MIN_SEEDERS=${SONARR_INDEXER_MIN_SEEDERS:-1}
      - ROOT_FOLDER=/data/files
      - TORRENT_FOLDER=/data/torrents/
      - WATCH_FOLDER=/data/completed/
      - WEBHOOK_URL=http://uploader:3000
    restart: 'no'
    depends_on:
      - jackett
      - radarr
      - sonarr
    volumes:
      - jackett_config:/config/jackett
      - radarr_config:/config/radarr:ro
      - sonarr_config:/config/sonarr:ro
      - ./data:/data

volumes:
  jackett_config:
  radarr_config:
  sonarr_config:
